{% extends "main/layout.html" %}{% load i18n crispy_forms_tags %}
{% block content %}
	<ol class="breadcrumb mb-2 mt-1">
		<li class="breadcrumb-item"><a href="{% url 'home' %}">VARANDA</a></li>
		<li class="breadcrumb-item"><a href="{% url 'user-list' %}">{% trans "Uza-na'in" %}</a></li>
		<li class="breadcrumb-item active" aria-current="page">{{ legend|upper }}</li>
	</ol>
	<div class="row"><div class="col-lg-6">
		<div class="card shadow-lg rounded">
			<div class="card-header">{{ legend|upper }}</div>
			<div class="card-body">
				<p class="small text-muted">{% trans "Sesaun hotu husi uza-na'in ne'e sei taka." %}</p>
				<form method="post" novalidate>{% csrf_token %}{% crispy form %}
					<button class="btn btn-success" type="submit"><i class="fa fa-save"></i> {% trans "Rai" %}</button>
					<a class="btn btn-outline-secondary" href="{% url 'user-list' %}">{% trans "Fila" %}</a>
				</form>
			</div>
		</div>
	</div></div>
{% endblock %}
