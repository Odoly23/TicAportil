{% extends "main/layout.html" %}{% load i18n crispy_forms_tags %}
{% block content %}
	<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
		<div class="card shadow-lg rounded"><div class="card-header">{% trans "Liafuan-pase foun" %}</div><div class="card-body">
		{% if validlink %}
			<form method="post">{% csrf_token %}{{ form|crispy }}<button class="btn btn-success btn-block" type="submit">{% trans "Rai" %}</button></form>
		{% else %}
			<div class="alert alert-danger">{% trans "Link la válidu ka expira ona." %}</div>
			<a class="btn btn-info" href="{% url 'password_reset' %}">{% trans "Husu link foun" %}</a>
		{% endif %}
		</div></div>
	</div></div>
{% endblock %}
